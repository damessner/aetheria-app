name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🚀 Prebuild Android Project
        run: bunx expo prebuild --platform android --clean

      - name: 🔨 Compile Android APK
        working-directory: android
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon \
            -PkotlinVersion=1.9.25 \
            -Dkotlin.suppressKotlinVersionCompatibilityCheck=true

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-android-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: 🎉 Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
