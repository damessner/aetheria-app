name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🚀 Prebuild Android Project
        run: bunx expo prebuild --platform android --clean

      - name: 🔧 Patch Kotlin & Compose Compiler Compatibility
        run: |
          # Patch gradle.properties to allow Kotlin version mismatch bypass
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties

          # Inject compiler suppression flags into all android subprojects
          cat << 'GRADLE_PATCH' >> android/build.gradle
          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P",
                          "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          GRADLE_PATCH

      - name: 🔨 Compile Android APK
        working-directory: android
        run: |
          ./gradlew assembleRelease assembleDebug -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25 -Pkotlin.suppressKotlinVersionCompatibilityCheck=true -PsuppressKotlinVersionCompatibilityCheck=true --no-daemon

      - name: ✍️ Sign & Verify APKs (v1, v2, v3 Signature Schemes)
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner from $APKSIGNER"

          KEYSTORE="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Creating debug keystore..."
            keytool -genkey -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aetheria, OU=Mobile, O=Aetheria, L=City, S=State, C=US"
          fi

          for apk in $(find android/app/build/outputs/apk -name "*.apk" -type f); do
            echo "Signing $apk ..."
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$apk"
            echo "Verifying $apk ..."
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-android-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: 🎉 Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
