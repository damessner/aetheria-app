name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.ver.outputs.version }}
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷 Determine Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🧪 Typecheck
        run: bunx tsc --noEmit

      - name: 🧪 Unit Tests
        run: bun test

      - name: 🚀 Prebuild Android Project
        run: bunx expo prebuild --platform android --clean

      - name: 🔑 Restore Stable Signing Keystore
        run: |
          # expo prebuild --clean wipes the android/ folder (including any keystore).
          # Restore the COMMITTED keystore so every release APK keeps the same
          # signature and users can always install updates over previous versions.
          cp keystore/aetheria-release.keystore android/app/debug.keystore

      - name: 🔧 Patch Kotlin & Compose Compiler Compatibility
        run: |
          # Patch gradle.properties to allow Kotlin version mismatch bypass
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties

          # Inject compiler suppression flags into all android subprojects
          cat << 'GRADLE_PATCH' >> android/build.gradle
          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P",
                          "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          GRADLE_PATCH

      - name: 🔢 Stamp Version from Tag
        working-directory: android
        run: |
          VERSION="${{ needs.version.outputs.value }}"
          # versionCode: derive a monotonically increasing integer from the version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" app/build.gradle
          echo "Stamped versionName=$VERSION versionCode=$CODE"

      - name: 🔨 Compile Android APK
        working-directory: android
        run: |
          ./gradlew assembleRelease assembleDebug -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25 -Pkotlin.suppressKotlinVersionCompatibilityCheck=true -PsuppressKotlinVersionCompatibilityCheck=true --no-daemon

      - name: ✍️ Sign & Verify APKs (v1, v2, v3 Signature Schemes)
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner from $APKSIGNER"

          KEYSTORE="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "FATAL: stable keystore missing after restore step" >&2
            exit 1
          fi

          for apk in $(find android/app/build/outputs/apk -name "*.apk" -type f); do
            echo "Signing $apk ..."
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$apk"
            echo "Verifying $apk ..."
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-android-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: 🎉 Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.value) }}
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
