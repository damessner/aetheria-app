name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🚀 Prebuild Android Project
        run: bunx expo prebuild --platform android --clean

      - name: 🔧 Patch Kotlin 1.9.25 in build.gradle & gradle.properties
        run: |
          sed -i "s/'1.9.24'/'1.9.25'/g" android/build.gradle
          sed -i 's/"1.9.24"/"1.9.25"/g' android/build.gradle
          printf "\nkotlin.suppressKotlinVersionCompatibilityCheck=true\nsuppressKotlinVersionCompatibilityCheck=true\n" >> android/gradle.properties

      - name: 🔨 Compile Android APK
        working-directory: android
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-android-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: 🎉 Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
