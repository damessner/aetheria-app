name: Over-The-Air (OTA) Update

on:
  push:
    branches:
      - main

jobs:
  publish-ota:
    name: Deploy Over-The-Air Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🚀 Setup EAS CLI
        run: bun add -g eas-cli

      - name: 📡 Publish OTA Update to Production Channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            eas update --auto --non-interactive
          else
            echo "No EXPO_TOKEN configured. Update bundle packaged for GitHub Release."
          fi
